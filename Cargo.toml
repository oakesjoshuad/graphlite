[package]
name = "graphlite"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
walkdir = "2.5"
rayon = "1.8"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.0"
